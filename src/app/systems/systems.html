<div class="grid grid-cols-4 gap-20 containr">
  @for (systems of systems(); track systems.id) {
    <div
      class="border rounded border-gray-200 shadow w-full h-[20rem] flex flex-col p-8 space-y-10"
    >
      <div class="grow pt-10">
        <h1 class="text-center font-bold text-2xl">{{ systems.name }}</h1>
      </div>
      <p class="flex flex-col gap-2">
        <button
          class="bg-blue-950 text-white rounded-md w-full hover:cursor-pointer hover:bg-blue-900"
          (click)="onOpenSystem(systems)"
        >
          Open System
        </button>
        <button
          class="bg-blue-950 text-white rounded-md w-full hover:cursor-pointer hover:bg-blue-900"
          (click)="onOpenSystem(systems, true)"
        >
          Open System In New Tab
        </button>
      </p>
    </div>
  }
</div>
